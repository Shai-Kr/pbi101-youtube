id: vr-dash
name: vr-dash
version: 1.0.0
services:
  connectors:
    enabled: true
  auth:
    enabled: true
    fabric:
      enabled: true
      externalEntraExchange: true
    password:
      enabled: false
    allowedRedirectUris:
      - http://localhost:5173
      - http://127.0.0.1:5173
  data:
    enabled: false
    path: packages/data
    buildCommand: npm run build
  staticHosting:
    enabled: true
    path: packages/frontend
    folder: dist
    buildCommand: npm run build:fabric
    indexDocument: index.html
    assetAccess: protected
    embedded:
      only: false
  storage:
    enabled: false
  functions:
    enabled: true
    path: "packages/functions"
    buildCommand: "npm run build"
    auth:
      type: "application"
connectors:
  - name: aurora
    type: fabric-semanticmodel
    config:
      workspaceId: YOUR_WORKSPACE_ID
      itemId: YOUR_SEMANTIC_MODEL_ID
    auth:
      type: delegated
    version: "1"
    operations:
      - name: executeQuery
